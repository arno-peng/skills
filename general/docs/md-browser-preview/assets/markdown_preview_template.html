<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --paper: #fffdf8;
      --ink: #1c1c1c;
      --muted: #6a6256;
      --line: #dfd4c2;
      --accent: #9a3412;
      --accent-soft: #fff1e8;
      --code-bg: #2b2b2b;
      --code-ink: #f4efe8;
      --quote: #7c5c3f;
      --shadow: 0 24px 60px rgba(49, 35, 20, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Serif SC", "Source Han Serif SC", serif;
      background:
        radial-gradient(circle at top left, rgba(154, 52, 18, 0.08), transparent 34%),
        linear-gradient(180deg, #f9f4eb 0%, #efe4d3 100%);
      color: var(--ink);
    }

    .shell {
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    .frame {
      max-width: 980px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid rgba(154, 52, 18, 0.14);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255, 241, 232, 0.95), rgba(255, 253, 248, 0.92));
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.08;
      font-weight: 700;
    }

    .meta {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    main {
      padding: 28px 32px 40px;
      line-height: 1.78;
      font-size: 17px;
    }

    h1, h2, h3, h4, h5, h6 {
      line-height: 1.25;
      margin: 1.7em 0 0.6em;
      color: #2e2117;
    }

    h1 { font-size: 2em; }
    h2 {
      font-size: 1.5em;
      padding-bottom: 0.25em;
      border-bottom: 1px solid var(--line);
    }
    h3 { font-size: 1.2em; }

    p {
      margin: 0.8em 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(154, 52, 18, 0.24);
    }

    a:hover {
      background: rgba(154, 52, 18, 0.08);
    }

    ul, ol {
      padding-left: 1.5em;
      margin: 0.8em 0;
    }

    li {
      margin: 0.35em 0;
    }

    blockquote {
      margin: 1em 0;
      padding: 0.2em 1em;
      color: var(--quote);
      background: var(--accent-soft);
      border-left: 4px solid rgba(154, 52, 18, 0.7);
      border-radius: 8px;
    }

    pre {
      overflow-x: auto;
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--code-bg);
      color: var(--code-ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    code {
      font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.92em;
    }

    :not(pre) > code {
      padding: 0.14em 0.42em;
      border-radius: 6px;
      background: rgba(154, 52, 18, 0.08);
      color: #7c2d12;
    }

    hr {
      border: 0;
      height: 1px;
      margin: 2em 0;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0 1.4em;
      font-size: 0.96em;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #fbf4ea;
    }

    img {
      max-width: 100%;
      border-radius: 12px;
    }

    @media (max-width: 720px) {
      .shell {
        padding: 18px 10px 36px;
      }

      .hero, main {
        padding-left: 18px;
        padding-right: 18px;
      }

      main {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="frame">
      <header class="hero">
        <p class="eyebrow">Markdown Preview</p>
        <h1>{{title}}</h1>
        <div class="meta">{{meta}}</div>
      </header>
      <main>
{{content}}
      </main>
    </div>
  </div>
</body>
</html>
